# EXAMPLE ONLY — copy to ~/.cloudflared/config.yml (mode 600).
# Never commit real tunnel UUIDs or credentials paths inside the repo.

tunnel: <TUNNEL_UUID>
credentials-file: /home/YOU/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: platform.example.com
    service: https://127.0.0.1:4400
    originRequest:
      connectTimeout: 10s
      noTLSVerify: true
      # tlsClientCert: /home/YOU/.control12-mtls/client.pem
      # tlsClientKey: /home/YOU/.control12-mtls/client.key
  - service: http_status:404
