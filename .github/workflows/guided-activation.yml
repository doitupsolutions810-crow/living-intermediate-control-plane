name: Guided activation policy tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/src/activation/**'
      - 'platform/test/activation-readiness.test.mjs'
      - 'docs/guided-activation.md'
      - '.github/workflows/guided-activation.yml'
  push:
    branches: [main]
    paths:
      - 'platform/src/activation/**'
      - 'platform/test/activation-readiness.test.mjs'
      - 'docs/guided-activation.md'
      - '.github/workflows/guided-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check platform/src/activation/readiness.mjs
      - name: Activation policy tests
        run: node --test platform/test/activation-readiness.test.mjs
