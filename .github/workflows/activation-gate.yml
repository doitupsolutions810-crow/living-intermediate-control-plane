name: AVRONE Safe Activation Gate

on:
  pull_request:
    branches: [main, feat/avrone-activation-gate-v0.36.1]
    paths:
      - 'status/activation-gate.mjs'
      - 'status/activation-guide.mjs'
      - 'test/activation-gate.test.mjs'
      - 'test/activation-guide.test.mjs'
      - 'test/activation-policy-parity.test.mjs'
      - 'platform/python-bridge/avrone_stack/activation_gate.py'
      - 'platform/python-bridge/avrone_stack/settings.py'
      - 'platform/python-bridge/avrone_stack/stdlib_server.py'
      - 'platform/python-bridge/avrone_stack/swarm.py'
      - 'platform/python-bridge/avrone_stack/executor_client.py'
      - 'platform/python-bridge/avrone_stack/executor_probe.py'
      - 'platform/python-bridge/run_avrone_stack.sh'
      - 'platform/python-bridge/tests/**'
      - 'docs/activation-gate.md'
      - 'docs/guided-activation.md'
      - 'docs/system-success-criteria.md'
      - 'platform/src/activation/**'
      - 'platform/test/activation-readiness.test.mjs'
      - '.github/workflows/activation-gate.yml'
      - 'package.json'
  push:
    branches: [main, feat/avrone-activation-gate-v0.36.1]
    paths:
      - 'status/activation-gate.mjs'
      - 'status/activation-guide.mjs'
      - 'test/activation-gate.test.mjs'
      - 'test/activation-guide.test.mjs'
      - 'platform/python-bridge/avrone_stack/activation_gate.py'
      - 'platform/python-bridge/avrone_stack/settings.py'
      - 'platform/python-bridge/avrone_stack/stdlib_server.py'
      - 'platform/python-bridge/avrone_stack/swarm.py'
      - 'platform/python-bridge/avrone_stack/executor_client.py'
      - 'platform/python-bridge/avrone_stack/executor_probe.py'
      - 'platform/python-bridge/run_avrone_stack.sh'
      - 'platform/python-bridge/tests/**'
      - 'docs/activation-gate.md'
      - 'docs/guided-activation.md'
      - 'docs/system-success-criteria.md'
      - 'platform/src/activation/**'
      - 'platform/test/activation-readiness.test.mjs'
      - '.github/workflows/activation-gate.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-gate:
    name: Safe activation policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Platform activation adapter syntax
        run: node --check platform/src/activation/readiness.mjs
      - name: Complete Node policy suite (runtime and platform adapter)
        run: npm test
      - name: Guided activation CLI smoke test
        run: npm run activation:guide
      - name: Python execution gate tests
        env:
          PYTHONPATH: platform/python-bridge
        run: python -m unittest discover -s platform/python-bridge/tests -v
      - name: Confirm safe default
        run: npm run activation:check
