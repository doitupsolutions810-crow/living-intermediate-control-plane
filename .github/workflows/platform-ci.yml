name: Platform verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
      - ".github/runner/**"
  push:
    branches:
      - "research/great-scale-api-contract"
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
      - ".github/runner/**"

permissions:
  contents: read

jobs:
  platform-test-build-smoke:
    # Fork/untrusted PR code stays on GitHub-hosted infrastructure. Trusted branch
    # pushes and manual dispatch use the isolated ephemeral Great Scale runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "great-scale"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate runner bootstrap shell syntax
        run: |
          for script in ../.github/runner/*.sh; do
            bash -n "$script"
          done
      - name: Report runtime
        run: node --version
      - name: Syntax-check server and Great Scale bridges
        run: |
          node --check src/server.mjs
          node --check src/bridge/great-scale.mjs
          node --check src/bridge/great-scale-research.mjs
          node --check test/great-scale.test.mjs
          node --check test/great-scale-research.test.mjs
      - name: Run platform test suite
        run: npm test
      - name: Build check
        run: |
          node --check src/server.mjs
          node --check src/bridge/great-scale.mjs
          node --check src/bridge/great-scale-research.mjs
      - name: Run HTTP smoke test
        run: npm run smoke
