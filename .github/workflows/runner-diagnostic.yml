name: Runner Startup Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-startup:
    name: Minimal hosted-runner probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner started
        run: |
          echo "RUNNER_STARTUP_OK"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
