name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: read

env:
  IMAGE_NAME: living-intermediate-control-plane
  IMAGE_TAG: ci

jobs:
  plane-checks:
    name: Doctor, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        run: node status/init.mjs

      - name: Doctor
        run: node status/doctor.mjs

      - name: Self-test
        run: node test/self-test.mjs

      - name: Health
        run: node status/health.mjs

      - name: Smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

  docker-build:
    name: Docker build (Buildx), SLSA, OPA
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (GHA layer cache + provenance metadata)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA-oriented build metadata (full registry attestations need push)
          provenance: mode=max
          sbom: true

      - name: Run doctor inside image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Capture image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }})
          echo "image_id=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > image-inspect.json

      - name: Write SLSA-style provenance document
        run: |
          cat > slsa-provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{
              "name": "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}",
              "digest": { "sha256": "${{ steps.digest.outputs.image_id }}" }
            }],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa.dev/container/v1",
                "externalParameters": {
                  "dockerfile": "Dockerfile",
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.repository }}",
                  "builder": "docker-buildx"
                },
                "resolvedDependencies": []
              },
              "runDetails": {
                "builder": { "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                "metadata": {
                  "invocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
                  "startedOn": "${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}"
                }
              }
            }
          }
          EOF

      - name: Upload SLSA provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-buildx
          path: |
            slsa-provenance.json
            image-inspect.json

      - name: Attest build provenance (SBOM subject when available)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: image-inspect.json

      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (JSON for OPA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-report.json
          policy: policy

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif

  kaniko-build:
    name: Kaniko (optimized cache + SBOM + SLSA + OPA)
    runs-on: ubuntu-latest
    needs: plane-checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optimized cache keys (layered restore):
      # 1) Full source hash — exact match
      # 2) Dockerfile + package/config — reuse when only app source changed
      # 3) Dockerfile only — reuse base/prepare layers when metadata unchanged
      # 4) OS prefix — last-resort partial restore
      - name: Cache Kaniko layers (optimized keys)
        uses: actions/cache@v4
        with:
          path: /tmp/kaniko-cache
          key: kaniko-${{ runner.os }}-df-${{ hashFiles('Dockerfile') }}-meta-${{ hashFiles('package.json', 'config.json') }}-src-${{ hashFiles('lib/**', 'lattice/**', 'agents/**', 'launchdesk/**', 'avrone/**', 'attestation/**', 'status/**', 'test/**', 'integrate.mjs') }}
          restore-keys: |
            kaniko-${{ runner.os }}-df-${{ hashFiles('Dockerfile') }}-meta-${{ hashFiles('package.json', 'config.json') }}-
            kaniko-${{ runner.os }}-df-${{ hashFiles('Dockerfile') }}-
            kaniko-${{ runner.os }}-

      - name: Prepare Kaniko dirs
        run: mkdir -p /tmp/kaniko-out /tmp/kaniko-cache

      - name: Build with Kaniko (cached)
        env:
          CACHE_REPO: ${{ secrets.KANIKO_CACHE_REPO }}
        run: |
          CACHE_ARGS="--cache=true --cache-dir=/cache --cache-ttl=2160h --compressed-caching"
          if [ -n "${CACHE_REPO}" ]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-repo=${CACHE_REPO}"
            echo "Remote Kaniko cache: ${CACHE_REPO}"
          else
            echo "Local Kaniko cache only (/cache via actions/cache)"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/tmp/kaniko-out:/out" \
            -v "/tmp/kaniko-cache:/cache" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --no-push \
            --tarPath=/out/plane.tar \
            --destination=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko \
            ${CACHE_ARGS} \
            --verbosity=info

      - name: Load Kaniko image
        run: docker load -i /tmp/kaniko-out/plane.tar

      - name: Run doctor inside Kaniko image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko

      - name: Capture Kaniko image id
        id: kaniko_digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko)
          echo "image_id=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko > kaniko-image-inspect.json

      - name: Generate SBOM with Syft (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          format: spdx-json
          output-file: sbom-kaniko.spdx.json
          upload-artifact: true
          artifact-name: sbom-kaniko-spdx

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          format: cyclonedx-json
          output-file: sbom-kaniko.cdx.json
          upload-artifact: true
          artifact-name: sbom-kaniko-cyclonedx

      - name: Write SLSA-style provenance (Kaniko)
        run: |
          cat > slsa-provenance-kaniko.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{
              "name": "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko",
              "digest": { "sha256": "${{ steps.kaniko_digest.outputs.image_id }}" }
            }],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa.dev/container/v1",
                "externalParameters": {
                  "dockerfile": "Dockerfile",
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.repository }}",
                  "builder": "kaniko"
                }
              },
              "runDetails": {
                "builder": { "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                "metadata": {
                  "invocationId": "${{ github.run_id }}-${{ github.run_attempt }}"
                }
              }
            }
          }
          EOF

      - name: Upload Kaniko SLSA provenance
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-kaniko
          path: |
            slsa-provenance-kaniko.json
            kaniko-image-inspect.json

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            sbom-kaniko.spdx.json
            sbom-kaniko.cdx.json

      - name: Trivy image scan (Kaniko, table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (Kaniko, JSON for OPA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-kaniko-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement on Kaniko image (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-kaniko-report.json
          policy: policy

      - name: Upload Kaniko Trivy JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-kaniko-report
          path: trivy-kaniko-report.json
