name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: living-intermediate-control-plane
  IMAGE_TAG: ci
  REGISTRY: ghcr.io

jobs:
  plane-checks:
    name: Verify, doctor, test, Trivy FS, Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        id: init_data
        run: node status/init.mjs

      - name: Upgrade check
        id: upgrade_check
        run: node status/upgrade-check.mjs

      - name: Verify changes
        id: verify_changes
        run: node status/verify-changes.mjs

      - name: Doctor
        id: doctor
        run: node status/doctor.mjs

      - name: Self-test and platform tests
        id: test_suite
        run: npm test

      - name: Health
        id: health
        run: node status/health.mjs

      - name: Checklist
        id: checklist
        run: node status/checklist.mjs

      - name: Smoke
        id: smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        id: dry_run_procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

      - name: Trivy FS scan
        id: trivy_fs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Snyk open-source scan
        id: snyk_open_source
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Snyk open-source skipped (no token)
        id: snyk_skipped
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set — open-source Snyk skipped (set repo secret to enforce)"

      - name: Summarize CI step outcomes
        id: ci_diagnostics
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          INIT_DATA_OUTCOME: ${{ steps.init_data.outcome }}
          UPGRADE_CHECK_OUTCOME: ${{ steps.upgrade_check.outcome }}
          VERIFY_CHANGES_OUTCOME: ${{ steps.verify_changes.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          TEST_SUITE_OUTCOME: ${{ steps.test_suite.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          CHECKLIST_OUTCOME: ${{ steps.checklist.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DRY_RUN_PROCURE_OUTCOME: ${{ steps.dry_run_procure.outcome }}
          TRIVY_FS_OUTCOME: ${{ steps.trivy_fs.outcome }}
          SNYK_OPEN_SOURCE_OUTCOME: ${{ steps.snyk_open_source.outcome }}
          SNYK_SKIPPED_OUTCOME: ${{ steps.snyk_skipped.outcome }}
        run: |
          {
            echo "# Plane CI diagnostics"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Checkout | ${CHECKOUT_OUTCOME:-not-reported} |"
            echo "| Setup Node | ${SETUP_NODE_OUTCOME:-not-reported} |"
            echo "| Init local data | ${INIT_DATA_OUTCOME:-not-reported} |"
            echo "| Upgrade check | ${UPGRADE_CHECK_OUTCOME:-not-reported} |"
            echo "| Verify changes | ${VERIFY_CHANGES_OUTCOME:-not-reported} |"
            echo "| Doctor | ${DOCTOR_OUTCOME:-not-reported} |"
            echo "| Self-test and platform tests | ${TEST_SUITE_OUTCOME:-not-reported} |"
            echo "| Health | ${HEALTH_OUTCOME:-not-reported} |"
            echo "| Checklist | ${CHECKLIST_OUTCOME:-not-reported} |"
            echo "| Smoke | ${SMOKE_OUTCOME:-not-reported} |"
            echo "| Dry-run procure | ${DRY_RUN_PROCURE_OUTCOME:-not-reported} |"
            echo "| Trivy FS | ${TRIVY_FS_OUTCOME:-not-reported} |"
            echo "| Snyk open source | ${SNYK_OPEN_SOURCE_OUTCOME:-not-run} |"
            echo "| Snyk skipped marker | ${SNYK_SKIPPED_OUTCOME:-not-run} |"
          } | tee CI-DIAGNOSTICS.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plane-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: CI-DIAGNOSTICS.md
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker, Trivy, OPA, Snyk container, registry, Cosign
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Decide registry push
        id: meta
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "do_push=false" >> "$GITHUB_OUTPUT"
            echo "image_ref=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.ENABLE_REGISTRY_PUSH }}" = "0" ]; then
            echo "do_push=false" >> "$GITHUB_OUTPUT"
            echo "image_ref=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          else
            echo "do_push=true" >> "$GITHUB_OUTPUT"
            echo "image_ref=${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
            echo "image_ref_sha=${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.meta.outputs.do_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load local)
        if: steps.meta.outputs.do_push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and push image
        id: build_push
        if: steps.meta.outputs.do_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Run doctor inside image (local load)
        if: steps.meta.outputs.do_push != 'true'
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Capture image identity
        id: digest
        run: |
          if [ "${{ steps.meta.outputs.do_push }}" = "true" ]; then
            DIGEST="${{ steps.build_push.outputs.digest }}"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "sign_ref=${{ steps.meta.outputs.image_ref_sha }}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            ID=$(docker inspect --format='{{.Id}}' ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }})
            echo "digest=${ID}" >> "$GITHUB_OUTPUT"
            echo "sign_ref=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
            docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > image-inspect.json
          fi

      - name: Write SLSA-style provenance document
        run: |
          cat > slsa-provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{
              "name": "${{ steps.meta.outputs.image_ref }}",
              "digest": { "sha256": "${{ steps.digest.outputs.digest }}" }
            }],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa.dev/container/v1",
                "externalParameters": {
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.repository }}",
                  "pushed": "${{ steps.meta.outputs.do_push }}"
                }
              },
              "runDetails": {
                "builder": { "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                "metadata": { "invocationId": "${{ github.run_id }}-${{ github.run_attempt }}" }
              }
            }
          }
          EOF

      - name: Upload SLSA provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-buildx
          path: slsa-provenance.json

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image JSON for OPA
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-report.json
          policy: policy

      - name: Snyk container scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ steps.meta.outputs.image_ref }}
          args: --severity-threshold=high

      - name: Snyk container skipped (no token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set — container Snyk skipped (set secret to enforce hard gate)"

      - name: Cosign sign (keyless, registry digest)
        if: steps.meta.outputs.do_push == 'true'
        run: |
          cosign sign --yes "${{ steps.digest.outputs.sign_ref }}"

      - name: Cosign verify (hard)
        if: steps.meta.outputs.do_push == 'true'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/plane-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.digest.outputs.sign_ref }}"

      - name: Cosign local note
        if: steps.meta.outputs.do_push != 'true'
        run: |
          echo "Registry push disabled (PR or ENABLE_REGISTRY_PUSH=0)."
          echo "Cosign hard verify requires a pushed digest — skipped."

      - name: Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
