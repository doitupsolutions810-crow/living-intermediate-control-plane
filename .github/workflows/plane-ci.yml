name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: living-intermediate-control-plane
  IMAGE_TAG: ci

jobs:
  plane-checks:
    name: Doctor, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        run: node status/init.mjs

      - name: Doctor
        run: node status/doctor.mjs

      - name: Self-test
        run: node test/self-test.mjs

      - name: Health
        run: node status/health.mjs

      - name: Smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

  docker-build:
    name: Docker build (Buildx), cache, scan
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Run doctor inside image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif

  # Alternative builder for environments without a Docker daemon (e.g. some K8s CI)
  kaniko-build:
    name: Kaniko build alternative
    runs-on: ubuntu-latest
    needs: plane-checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kaniko runs inside a container and builds without Docker-in-Docker.
      # Image is written to a local tar (no registry push required for CI verification).
      - name: Build with Kaniko (tar output)
        run: |
          mkdir -p /tmp/kaniko-out
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/tmp/kaniko-out:/out" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --no-push \
            --tarPath=/out/plane.tar \
            --destination=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko \
            --cache=false \
            --verbosity=info

      - name: Load Kaniko tar and run doctor
        run: |
          docker load -i /tmp/kaniko-out/plane.tar
          # Kaniko destination tag may appear as the name used in --destination
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko || \
          docker run --rm $(docker images -q --filter "reference=${{ env.IMAGE_NAME }}*" | head -n1)

      - name: Trivy scan Kaniko-built image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml
        continue-on-error: true
