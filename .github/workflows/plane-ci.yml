name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: living-intermediate-control-plane
  IMAGE_TAG: ci

jobs:
  plane-checks:
    name: Doctor, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        run: node status/init.mjs

      - name: Doctor
        run: node status/doctor.mjs

      - name: Self-test
        run: node test/self-test.mjs

      - name: Health
        run: node status/health.mjs

      - name: Smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

  docker-build:
    name: Docker build (Buildx), cache, scan, OPA
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Run doctor inside image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (JSON for OPA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-report.json
          policy: policy

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif

  kaniko-build:
    name: Kaniko build (cache + SBOM + OPA)
    runs-on: ubuntu-latest
    needs: plane-checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Persistent Kaniko layer cache between workflow runs
      - name: Cache Kaniko layers
        uses: actions/cache@v4
        with:
          path: /tmp/kaniko-cache
          key: kaniko-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package.json', 'config.json', 'lib/**', 'lattice/**', 'agents/**', 'status/**', 'integrate.mjs') }}
          restore-keys: |
            kaniko-${{ runner.os }}-

      - name: Prepare Kaniko output dirs
        run: |
          mkdir -p /tmp/kaniko-out /tmp/kaniko-cache

      # Kaniko cache configuration:
      #   --cache=true           enable layer caching
      #   --cache-dir=/cache     local cache directory (backed by actions/cache)
      #   --cache-ttl=2160h      keep cached layers ~90 days inside the cache dir
      #   --cache-repo=...       optional remote cache (set secrets.KANIKO_CACHE_REPO to enable)
      #   --compressed-caching   reduce cache size on disk
      - name: Build with Kaniko (cached)
        env:
          CACHE_REPO: ${{ secrets.KANIKO_CACHE_REPO }}
        run: |
          CACHE_ARGS="--cache=true --cache-dir=/cache --cache-ttl=2160h --compressed-caching"
          if [ -n "${CACHE_REPO}" ]; then
            CACHE_ARGS="${CACHE_ARGS} --cache-repo=${CACHE_REPO}"
            echo "Using remote Kaniko cache repo: ${CACHE_REPO}"
          else
            echo "Using local Kaniko cache dir only (/cache via actions/cache)"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/tmp/kaniko-out:/out" \
            -v "/tmp/kaniko-cache:/cache" \
            gcr.io/kaniko-project/executor:v1.23.2-debug \
            --dockerfile=/workspace/Dockerfile \
            --context=dir:///workspace \
            --no-push \
            --tarPath=/out/plane.tar \
            --destination=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko \
            ${CACHE_ARGS} \
            --verbosity=info

      - name: Load Kaniko image
        run: |
          docker load -i /tmp/kaniko-out/plane.tar
          docker image ls | grep -E "${{ env.IMAGE_NAME }}|kaniko" || true

      - name: Run doctor inside Kaniko image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko

      # Syft SBOM generation for the Kaniko-built image
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          format: spdx-json
          output-file: sbom-kaniko.spdx.json
          upload-artifact: true
          artifact-name: sbom-kaniko-spdx

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          format: cyclonedx-json
          output-file: sbom-kaniko.cdx.json
          upload-artifact: true
          artifact-name: sbom-kaniko-cyclonedx

      - name: Trivy image scan (Kaniko, table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (Kaniko, JSON for OPA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-kaniko
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-kaniko-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement on Kaniko image (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-kaniko-report.json
          policy: policy

      - name: Upload Kaniko Trivy JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-kaniko-report
          path: trivy-kaniko-report.json
