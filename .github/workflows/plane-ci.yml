name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plane-checks:
    name: Doctor, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        run: node status/init.mjs

      - name: Doctor
        run: node status/doctor.mjs

      - name: Self-test
        run: node test/self-test.mjs

      - name: Health
        run: node status/health.mjs

      - name: Smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: living-intermediate-control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run doctor inside image
        run: docker run --rm living-intermediate-control-plane:ci
