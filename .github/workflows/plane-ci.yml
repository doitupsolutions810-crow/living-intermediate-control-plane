name: Plane CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: read
  security-events: write

env:
  IMAGE_NAME: living-intermediate-control-plane
  IMAGE_TAG: ci

jobs:
  plane-checks:
    name: Doctor, test, smoke, Trivy FS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init local data
        run: node status/init.mjs

      - name: Doctor
        run: node status/doctor.mjs

      - name: Self-test
        run: node test/self-test.mjs

      - name: Health
        run: node status/health.mjs

      - name: Smoke
        run: node status/smoke.mjs

      - name: Dry-run procure
        run: DRY_RUN=1 ACCEPT_LOCAL_EVIDENCE=1 node integrate.mjs procure

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Snyk open-source scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}

  docker-build:
    name: Docker build, Trivy, OPA, Cosign, SLSA
    runs-on: ubuntu-latest
    needs: plane-checks
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Run doctor inside image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Capture image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{.Id}}' ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }})
          echo "image_id=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > image-inspect.json

      - name: Write SLSA-style provenance document
        run: |
          cat > slsa-provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{
              "name": "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}",
              "digest": { "sha256": "${{ steps.digest.outputs.image_id }}" }
            }],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://slsa.dev/container/v1",
                "externalParameters": {
                  "dockerfile": "Dockerfile",
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.repository }}",
                  "builder": "docker-buildx"
                }
              },
              "runDetails": {
                "builder": { "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                "metadata": {
                  "invocationId": "${{ github.run_id }}-${{ github.run_attempt }}"
                }
              }
            }
          }
          EOF

      - name: Upload SLSA provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-buildx
          path: |
            slsa-provenance.json
            image-inspect.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: image-inspect.json

      # Cosign keyless signing works best on a registry digest.
      # With load-only images this step is best-effort and non-blocking.
      - name: Cosign version
        run: cosign version

      - name: Cosign sign (best-effort keyless)
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: node status/cosign-sign.mjs

      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: trivy.yaml

      - name: Trivy image scan (JSON for OPA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: OPA policy enforcement (Conftest)
        uses: instrumenta/conftest-action@master
        with:
          files: trivy-report.json
          policy: policy

      - name: Snyk container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          args: --severity-threshold=high
        if: ${{ env.SNYK_TOKEN != '' }}

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"
          trivy-config: trivy.yaml

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
